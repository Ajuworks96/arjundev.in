version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: arjundev_db
    restart: always
    environment:
      POSTGRES_DB: arjundev
      POSTGRES_USER: arjun
      POSTGRES_PASSWORD: arjunpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
